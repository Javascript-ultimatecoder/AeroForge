services:
  - type: web
    name: aeroforge-plus
    env: python
    plan: free
    rootDir: aeroforge
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn aeroforge_app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: AEROFORGE_ENV
        value: production
      - key: AEROFORGE_MAX_ITERATIONS
        value: "1000"
